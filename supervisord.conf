; supervisord config for tg-bridge (http://supervisord.org).
; Started by bin/tg-ensure, which sets TG_BRIDGE_STATE (private 0700 state dir)
; and TG_WATCHDOG_SECONDS. Control it with bin/tg-ctl (supervisorctl).

[unix_http_server]
file=%(ENV_TG_BRIDGE_STATE)s/supervisor.sock
chmod=0700

[supervisord]
logfile=%(ENV_TG_BRIDGE_STATE)s/supervisord.log
logfile_maxbytes=2MB
logfile_backups=2
pidfile=%(ENV_TG_BRIDGE_STATE)s/supervisord.pid
umask=077
directory=%(here)s
identifier=tg-bridge

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_TG_BRIDGE_STATE)s/supervisor.sock

; The relay. Exit codes 0 (stopped), 2 (config/token error) and 3 (another
; relay holds the lock) are deliberate and not restarted; anything else
; (crash, watchdog exit 70, SIGKILL from tg-watchdog) is restarted at once.
[program:tg-bridge]
command=%(here)s/.venv/bin/python -m tgbridge.relay
directory=%(here)s
autostart=true
autorestart=unexpected
exitcodes=0,2,3
startsecs=10
startretries=10
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_TG_BRIDGE_STATE)s/relay.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

; Out-of-process hang detector: every 5 s checks the relay heartbeat and
; SIGKILLs a relay that is RUNNING but silent (frozen) via supervisord RPC.
[eventlistener:tg-watchdog]
command=%(here)s/.venv/bin/python -m tgbridge.watchdog
directory=%(here)s
events=TICK_5
autostart=true
autorestart=true
stdout_logfile=NONE
stderr_logfile=%(ENV_TG_BRIDGE_STATE)s/watchdog.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1
